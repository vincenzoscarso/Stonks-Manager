<!-- fab.html -->
<div class="fab-group" id="fab-group" style="display:none;">
    <!-- Left: Scan Receipt -->
    <button class="fab-btn" id="fab-scan-receipt" onclick="openScanReceiptModal()" title="Scansiona Scontrino">
        🧾 <span>Scontrino</span>
    </button>

    <!-- Center (main): AI Insert -->
    <button class="fab-btn fab-btn-main" id="fab-quick-insert" onclick="openQuickInsertModal()" title="Inserimento AI">
        <img src="assets/face.png" alt="AI" style="width:20px; height:20px; border-radius:50%; vertical-align:middle; margin-right:4px;"> Inserimento AI
    </button>

    <!-- Right: Manual New Transaction -->
    <button class="fab-btn" id="fab-new-transaction" onclick="openTransactionModalForAdd()" title="Nuova Transazione">
        ➕ <span>Nuova</span>
    </button>
</div>
