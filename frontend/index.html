<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stonks Manager</title>
    <meta name="description"
        content="Dashboard personale per gestire entrate, uscite e conti multipli con AI integrata." />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/favicon.png" />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/main.css" />

    <!-- Chart.js (dashboard pie chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Supabase JS SDK (to get JWT) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <!-- Supabase variables injected by server from .env file (see server.py) -->
    <script src="/config.js"></script>
</head>

<body>

    <!-- ============================================================
     SUPABASE INITIALIZATION AND COMPONENT LOADING
     ============================================================ -->
    <script>
        window.sbClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

        // Load HTML interfaces dynamically on app startup
        document.addEventListener("DOMContentLoaded", async () => {
            await loadComponents();
            authInit(); // Start authentication after HTML is loaded
        });
    </script>

    <!-- ============================================================
     SECTION 1: AUTHENTICATION (Injected by loadComponents)
     ============================================================ -->
    <section id="section-auth"></section>


    <!-- ============================================================
     SECTION 2: MAIN APP (SPA)
     ============================================================ -->
    <section id="section-app" style="display:none;">

        <!-- HEADER / HAMBURGER -->
        <header class="app-header">
            <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
            <h1 class="app-title" onclick="showPage('dashboard')" style="cursor:pointer;">Stonks Manager</h1>
            <img src="assets/favicon.png" alt="Logo" class="header-logo" onclick="showPage('info')" style="width:32px; height:32px; cursor:pointer;">
        </header>

        <!-- SIDEBAR -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <button class="modal-close-btn" onclick="toggleSidebar()">✕</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" onclick="showPage('dashboard')">🏠 Dashboard</a></li>
                <li><a href="#" onclick="showPage('history')">💸 Transazioni</a></li>
                <li><a href="#" onclick="showPage('categories')">🏷️ Categorie</a></li>
                <li><a href="#" onclick="showPage('accounts')">🏦 Conti</a></li>
                <li><a href="#" onclick="showPage('profile')">👤 Profilo</a></li>
                <li><a href="#" onclick="showPage('info')">ℹ️ Informazioni</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-secondary" onclick="authLogout()" style="width:100%">Logout</button>
            </div>
        </nav>

        <!-- PAGE CONTAINER (Injected by loadComponents) -->
        <div class="page-container" id="page-container">
            <!-- dashboard.html, transactions.html, etc. will be injected here -->
        </div>

        <!-- GLOBAL PAGE LOADER -->
        <div id="global-page-loader" style="display:flex; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(18,18,18,0.9); z-index:9999; justify-content:center; align-items:center; flex-direction:column;">
            <img src="assets/face.png" class="spinner-ai large fast" alt="Loading">
            <p style="margin-top:16px; color:var(--text-muted); font-weight:bold;">Caricamento...</p>
        </div>

        <!-- GLOBAL AUTH ERROR BANNER -->
        <div id="global-auth-error" style="display:none; position:fixed; top:0; left:0; right:0; background:var(--color-danger); color:var(--text-primary); padding:16px; text-align:center; z-index:10000; font-weight:bold; box-shadow:var(--shadow-md); align-items:center; justify-content:center; flex-wrap:wrap; gap:12px;">
            La tua sessione è scaduta o non è più valida.
            <button onclick="document.getElementById('global-auth-error').style.display='none'; authLogout();" style="padding:8px 16px; border:none; border-radius:var(--radius-sm); background:var(--bg-surface); color:var(--color-danger); cursor:pointer; font-weight:bold; box-shadow:var(--shadow-sm);">Effettua il Login</button>
        </div>

    </section>

    <!-- ============================================================
     MODALS AND FAB (Injected by loadComponents into body)
     ============================================================ -->


    <!-- ============================================================
     JS SCRIPTS
     ============================================================ -->
    <script src="scripts/api.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/ui_logic.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/accounts.js"></script>
    <script src="scripts/categories.js"></script>
    <script src="scripts/transactions.js"></script>
    <script src="scripts/dashboard.js"></script>
    <script src="scripts/ai.js"></script>

</body>
</html>
