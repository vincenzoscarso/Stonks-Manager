<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Stonks Manager — MyWallet</title>
    <meta name="description"
        content="Dashboard personale per gestire entrate, uscite e conti multipli con AI integrata." />

    <!-- CSS -->
    <link rel="stylesheet" href="styles/main.css" />

    <!-- Chart.js (dashboard pie chart) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

    <!-- Supabase JS SDK (to get JWT) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

    <!-- Supabase variables injected by server from .env file (see server.py) -->
    <script src="/config.js"></script>
</head>

<body>

    <!-- ============================================================
     SUPABASE INITIALIZATION AND COMPONENT LOADING
     ============================================================ -->
    <script>
        window.sbClient = supabase.createClient(window.SUPABASE_URL, window.SUPABASE_KEY);

        // Load HTML interfaces dynamically on app startup
        document.addEventListener("DOMContentLoaded", async () => {
            await loadComponents();
            authInit(); // Start authentication after HTML is loaded
        });
    </script>

    <!-- ============================================================
     SECTION 1: AUTHENTICATION (Injected by loadComponents)
     ============================================================ -->
    <section id="section-auth"></section>


    <!-- ============================================================
     SECTION 2: MAIN APP (SPA)
     ============================================================ -->
    <section id="section-app" style="display:none;">

        <!-- HEADER / HAMBURGER -->
        <header class="app-header">
            <button class="hamburger-btn" onclick="toggleSidebar()">☰</button>
            <h1 class="app-title">Stonks Manager</h1>
            <div style="width:40px;"></div> <!-- Placeholder to center title -->
        </header>

        <!-- SIDEBAR -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleSidebar()"></div>
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3>Menu</h3>
                <button class="modal-close-btn" onclick="toggleSidebar()">✕</button>
            </div>
            <ul class="sidebar-menu">
                <li><a href="#" onclick="showPage('dashboard')">🏠 Dashboard</a></li>
                <li><a href="#" onclick="showPage('history')">💸 Transazioni</a></li>
                <li><a href="#" onclick="showPage('accounts')">🏦 Conti</a></li>
                <li><a href="#" onclick="showPage('categories')">🏷️ Categorie</a></li>
                <li><a href="#" onclick="showPage('profile')">👤 Profilo</a></li>
            </ul>
            <div class="sidebar-footer">
                <button class="btn-secondary" onclick="authLogout()" style="width:100%">Logout</button>
            </div>
        </nav>

        <!-- PAGE CONTAINER (Injected by loadComponents) -->
        <div class="page-container" id="page-container">
            <!-- dashboard.html, transactions.html, etc. will be injected here -->
        </div>

    </section>

    <!-- ============================================================
     MODALS AND FAB (Injected by loadComponents into body)
     ============================================================ -->


    <!-- ============================================================
     JS SCRIPTS
     ============================================================ -->
    <script src="scripts/api.js"></script>
    <script src="scripts/app.js"></script>
    <script src="scripts/ui_logic.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="scripts/accounts.js"></script>
    <script src="scripts/categories.js"></script>
    <script src="scripts/transactions.js"></script>
    <script src="scripts/dashboard.js"></script>
    <script src="scripts/ai.js"></script>

</body>
</html>
