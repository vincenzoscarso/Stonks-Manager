<!-- auth.html -->
<h1 style="text-align:center; margin-bottom: 24px; color:var(--color-primary);">Stonks Manager</h1>
<div class="auth-card">
    <h2 id="auth-title">Accedi</h2>
    <div id="auth-error" class="error-msg"></div>

    <!-- LOGIN FORM -->
    <div id="form-login">
        <div class="form-group">
            <label for="login-email">Email:</label>
            <input type="email" id="login-email" placeholder="user@stonksmanager.org" />
        </div>
        <div class="form-group">
            <label for="login-password">Password:</label>
            <input type="password" id="login-password" placeholder="Password" />
        </div>
        <button id="btn-login" class="btn-primary" onclick="handleLogin()">Accedi</button>
        <div style="text-align: center; margin-top: 16px;">
            <a href="#" onclick="toggleAuthForm('register'); return false;" style="color: var(--color-primary); text-decoration: none;">Non hai un account? Registrati</a>
        </div>
    </div>

    <!-- REGISTRATION FORM -->
    <div id="form-register" style="display: none;">
        <div class="form-group">
            <label for="reg-displayname">Nome visualizzato:</label>
            <input type="text" id="reg-displayname" placeholder="Mario Rossi" />
        </div>
        <div class="form-group">
            <label for="reg-email">Email:</label>
            <input type="email" id="reg-email" placeholder="user@stonksmanager.org" />
        </div>
        <div class="form-group">
            <label for="reg-password">Password:</label>
            <input type="password" id="reg-password" placeholder="Almeno 6 caratteri" />
        </div>
        <button id="btn-register" class="btn-primary" onclick="handleRegister()">Registrati</button>
        <div style="text-align: center; margin-top: 16px;">
            <a href="#" onclick="toggleAuthForm('login'); return false;" style="color: var(--color-primary); text-decoration: none;">Hai già un account? Accedi</a>
        </div>
        <div id="reg-success" style="display:none; color: var(--color-success); margin-top: 10px;">
            Registrazione avvenuta! Controlla la tua email per confermare (se richiesto) o procedi al login.
        </div>
    </div>
</div>
